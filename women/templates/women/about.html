{% extends "base.html" %}
{% block content %}
    {% for item in current_page %}
        <p>{{ item.title }}</p>
    {% endfor %}
    <nav>
        <ul>
            {% for page in current_page.paginator.page_range %}
                <li>
                    <a href="?page={{ page }}">{{ page }}</a>
                </li>
            {% endfor %}
        </ul>
    </nav>
{% endblock %}
